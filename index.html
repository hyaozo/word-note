<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>단어장</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="password-screen" id="passwordScreen">
    <div class="password-box">
      <div class="password-title">단어장</div>
      <div class="password-desc">
        사용하려면 비밀번호를 입력하세요.<br />
        한 번 통과하면 같은 브라우저에서는 다시 묻지 않습니다.
      </div>
      <input
        type="password"
        id="passwordInput"
        class="password-input"
        placeholder="비밀번호 입력"
        autocomplete="current-password"
      />
      <div class="password-actions" style="margin-top:12px;">
        <button class="password-btn" id="passwordSubmitButton" type="button">들어가기</button>
      </div>
      <div class="password-message" id="passwordMessage"></div>
    </div>
  </div>

  <div class="container app-shell hidden" id="appShell">
    <div class="top-box">
      <input
        type="text"
        id="wordInput"
        class="word-input"
        placeholder="영단어를 입력하세요"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      />

      <input
        type="text"
        id="meaningInput"
        class="meaning-input"
        placeholder="뜻을 입력하세요"
      />

      <input
        type="text"
        id="pronunciationInput"
        class="pronunciation-input"
        placeholder="발음 입력 (선택사항)"
      />

      <div class="help-text">
        단어, 뜻, 발음을 입력한 뒤 Enter 또는 저장 버튼으로 저장할 수 있습니다.
      </div>

      <div class="button-row">
        <button class="action-btn" id="resetButton" type="button">초기화</button>
        <button class="action-btn" id="naverButton" type="button">사전</button>
        <button class="action-btn" id="saveButton" type="button">저장</button>
        <button class="action-btn" id="backToListButton" type="button">제자리</button>
        <label class="file-label" for="fileInput">파일 불러오기</label>
        <input class="hidden-file" type="file" id="fileInput" accept=".txt,.csv" />
        <button class="action-btn" id="bulkToggleButton" type="button">복붙 가져오기</button>
        <button class="action-btn" id="saveBackupButton" type="button">백업 저장</button>
        <button class="action-btn" id="restoreBackupButton" type="button">백업 복원</button>
      </div>

      <div class="bulk-box" id="bulkBox">
        <div class="info-title">여러 줄 가져오기</div>
        <textarea
          id="bulkInput"
          class="bulk-textarea"
          placeholder="*예시&#10;영어 단어 : 뜻 : 발음 [발음기호] : 품사&#10;apple: 사과 : 애플 [ˈæpəl] : 명사&#10;run: 달리다, 달리기 : 런 [rʌn] : 동, 명&#10;at once: 즉시, 한 번에 : 앳 원스 [ət ˈwʌns] : 숙어&#10;"
        ></textarea>
        <div class="bulk-actions">
          <button class="action-btn" id="bulkPreviewButton" type="button">미리보기</button>
          <button class="action-btn" id="bulkClearButton" type="button">입력 지우기</button>
        </div>
      </div>

      <div class="info-box">
        <div class="info-title">조회 결과</div>
        <div class="info-inline">
          <div class="info-word" id="resultWord"></div>
          <div class="info-pron" id="resultPronunciation"></div>
        </div>
        <div class="info-meaning" id="resultMeaning"></div>
      </div>

      <div class="message" id="message"></div>

      <div class="toolbar-box">
        <div class="toolbar-head">
          <div class="toolbar-title">저장된 단어</div>
          <div class="toolbar-meta" id="statsText">전체 0개 · 숨김 0개 · 외운 단어 숨김 꺼짐</div>
        </div>

        <div class="toolbar-main">
          <div class="search-wrap">
            <input
              type="text"
              id="searchInput"
              class="search-input"
              placeholder="검색 / 단어 / 뜻 / 발음 / 품사 / 숙어"
            />
            <button id="searchClearButton" class="search-clear-btn" type="button">×</button>
          </div>

          <div class="toolbar-controls">
            <div class="tool-chip">
              <label>
                <input type="checkbox" id="selectAllDelete" />
                전체 선택
              </label>
            </div>

            <button class="toolbar-delete-btn" id="deleteSelectedButton" type="button">선택 삭제</button>

            <select id="sortSelect" class="tool-select">
              <option value="latest">정렬: 최신순</option>
              <option value="alphabet">정렬: 알파벳순</option>
              <option value="memorized">정렬: 외운 순</option>
            </select>

            <select id="pageSizeSelect" class="tool-select">
              <option value="10">10개씩 보기</option>
              <option value="20" selected>20개씩 보기</option>
              <option value="50">50개씩 보기</option>
              <option value="100">100개씩 보기</option>
              <option value="all">전체 보기</option>
            </select>
          </div>
        </div>
      </div>

      <input type="checkbox" id="hideMemorized" hidden />

      <div class="note-list" id="noteList"></div>

      <div class="pagination-wrap" id="paginationWrap">
        <button class="page-btn" id="prevPageButton" type="button">이전</button>
        <div class="page-info" id="pageInfo">1 / 1</div>
        <button class="page-btn" id="nextPageButton" type="button">다음</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="confirmModal">
    <div class="modal">
      <div class="modal-title">이미 저장된 단어입니다</div>
      <div class="modal-text" id="modalText"></div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modalCancel" type="button">취소</button>
        <button class="modal-btn" id="modalConfirm" type="button">수정</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="deleteConfirmModal">
    <div class="modal">
      <div class="modal-title" id="deleteModalTitle">삭제 확인</div>
      <div class="modal-text" id="deleteModalText">정말 삭제하시겠습니까?</div>
      <div class="modal-actions">
        <button class="modal-btn cancel" id="deleteModalCancel" type="button">취소</button>
        <button class="modal-btn danger" id="deleteModalConfirm" type="button">삭제</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="quizModal">
    <div class="modal quiz-modal">
      <div class="modal-title">단어퀴즈</div>

      <div class="quiz-mode-row">
        <button class="modal-btn quiz-mode-btn active" id="quizHideMeaningButton" type="button">뜻 가리기</button>
        <button class="modal-btn quiz-mode-btn" id="quizHideWordButton" type="button">단어 가리기</button>
      </div>

      <div class="quiz-status" id="quizStatus">남은 카드 0개 · 다시 볼 카드 0개</div>

      <div class="quiz-card">
        <div class="quiz-label" id="quizFrontLabel">단어</div>
        <div class="quiz-front" id="quizFront"></div>

        <div class="quiz-answer-wrap" id="quizAnswerWrap">
          <div class="quiz-label" id="quizBackLabel">뜻</div>
          <div class="quiz-back" id="quizBack"></div>
          <div class="quiz-pron" id="quizPronunciation"></div>
        </div>
      </div>

      <div class="quiz-actions" id="quizActionsBefore">
        <button class="modal-btn" id="quizRevealButton" type="button">정답 보기</button>
        <button class="modal-btn cancel" id="quizDontKnowButton" type="button">모름</button>
        <button class="modal-btn cancel" id="quizCloseButton" type="button">닫기</button>
      </div>

      <div class="quiz-actions" id="quizActionsAfter" style="display:none;">
        <button class="modal-btn" id="quizMemorizedButton" type="button">외움</button>
        <button class="modal-btn cancel" id="quizStudyAgainButton" type="button">다시 공부</button>
        <button class="modal-btn" id="quizNextButton" type="button">다음</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="previewModal">
    <div class="modal">
      <div class="modal-title">가져오기 미리보기</div>
      <div class="preview-note" id="previewNote"></div>

      <div class="preview-table-wrap">
        <table class="preview-table">
          <thead>
            <tr>
              <th>상태</th>
              <th>단어</th>
              <th>뜻</th>
              <th>발음</th>
              <th>품사</th>
            </tr>
          </thead>
          <tbody id="previewTableBody"></tbody>
        </table>
      </div>

      <div class="modal-actions">
        <button class="modal-btn cancel" id="previewCancelButton" type="button">취소</button>
        <button class="modal-btn" id="previewImportButton" type="button">다음</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="updateCheckModal">
    <div class="modal">
      <div class="modal-title">수정 내용 확인</div>
      <div class="preview-note" id="updateCheckNote"></div>

      <div class="preview-table-wrap">
        <table class="preview-table">
          <thead>
            <tr>
              <th>단어</th>
              <th>이전 뜻</th>
              <th>새 뜻</th>
              <th>이전 발음</th>
              <th>새 발음</th>
              <th>이전 품사</th>
              <th>새 품사</th>
            </tr>
          </thead>
          <tbody id="updateCheckTableBody"></tbody>
        </table>
      </div>

      <div class="modal-actions">
        <button class="modal-btn cancel" id="updateCheckCancelButton" type="button">전체 취소</button>
        <button class="modal-btn" id="updateCheckAddOnlyButton" type="button">새 단어만 저장</button>
        <button class="modal-btn" id="updateCheckApplyButton" type="button">수정 포함 저장</button>
      </div>
    </div>
  </div>

  <button id="quizButton" class="floating-mini-button floating-quiz-button" type="button">퀴즈</button>
  <button id="floatingLockButton" class="floating-mini-button floating-lock-button" type="button">잠금</button>
  <button id="floatingHideButton" class="floating-mini-button floating-hide-button" type="button">숨김</button>
</body>
</html>
